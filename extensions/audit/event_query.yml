---
# Indirect node counting queries for the google.cloud collection.
#
# These jq expressions run inside the Automation Platform controller
# (awx/main/tasks/host_indirect.py) against each module's result, and their
# output feeds subscription node counting. Nothing in this repository executes
# them, so tests/unit/audit/test_event_query_contract.py asserts the contract
# the controller imposes on the output.
#
# WHY THIS FILE IS NAMED event_query.yml
# --------------------------------------
# The controller only ever reads extensions/audit/event_query.yml
# (awx/playbooks/library/indirect_instance_count.py). The previous file was
# named extensions/audit/taxonomy.jq, so it was never loaded.
#
# THE CONTRACT
# ------------
# name             must be present and never null -- `if name is None: continue`
# name             must also be UNIQUE WITHIN A JOB. IndirectManagedNodeAudit
#                  declares unique_together = [('name', 'job')] and the
#                  controller bulk_create()s a job's records in one
#                  transaction, so two resources that dedup apart but share a
#                  name -- two instances called "web-01" in different zones, or
#                  an A and a TXT record on one DNS name -- raise IntegrityError
#                  and lose EVERY audit record for that job, not just the
#                  colliding pair. The rollback reverts event_queries_processed
#                  too, so the fallback task re-picks the job and fails again
#                  until it ages out. Every module below therefore emits its
#                  identifier as `name` and its display name as `facts.name`,
#                  which is not constrained.
# canonical_facts  must be present, truthy, and free of null at ANY depth.
#                  get_hashable_form() accepts int/float/str/bool/dict/list/
#                  tuple and raises UnhashableFacts on anything else, including
#                  null; the caller catches it and skips the record. A single
#                  null field silently discards the whole node, with the job
#                  still green.
# canonical_facts  is the ONLY dedup key (`results[hashable_facts]`), so it must
#                  hold identity and nothing else. Anything in it that changes
#                  over the life of a resource re-counts that resource.
# facts            must carry infra_type, infra_bucket and device_type; a
#                  resource without them is counted but cannot be bucketed.
#
# WHY THERE IS ONE ENTRY PER MODULE
# ---------------------------------
# The previous query was a single wildcard expression that looked the resource
# up in a table keyed by `$data.action`. The controller passes jq only
# `event_data['res']` -- the module's result dict -- and no google.cloud module
# puts its own name in its result, so that lookup never matched. The module name
# is available to the controller as the YAML key, which is what is used here.
#
# The identifier for each module below is whatever its response_to_hash()
# actually returns. etag is deliberately never used: it changes on every
# mutation, so a resource keyed on it is counted again each time it is touched.

google.cloud.gcp_bigquery_dataset:
  query: >-
    select(type == "object") | select(.id != null) |
    {
      name: (.id | tostring),
      canonical_facts: {
        id: (.id | tostring)
      },
      facts: {
        infra_type: "public_cloud",
        infra_bucket: "database",
        device_type: "database_analytics",
        module: "gcp_bigquery_dataset",
        name: (.name // (.id | tostring))
      }
    }
