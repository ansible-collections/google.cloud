# A record set is identified by name AND type: an A record and a TXT
# record on the same name are two resources. Keying on name alone
# collapsed them into one.
google.cloud.gcp_dns_resource_record_set:
  query: >-
    select(type == "object") | select(.name != null) |
    {
      name: ((.name | tostring) + "/" + (.type | tostring)),
      canonical_facts: {
        id: ((.name | tostring) + "/" + (.type | tostring))
      },
      facts: {
        infra_type: "public_cloud",
        infra_bucket: "networking",
        device_type: "dns",
        module: "gcp_dns_resource_record_set",
        name: (.name | tostring)
      }
    }
# response_to_hash() returns etag but no id, so the previous fallback
# chain (.id // .etag // .selfLink // .name) resolved to etag -- which
# changes on every mutation, so each update counted the same instance
# again. name is the full resource path and is stable.
