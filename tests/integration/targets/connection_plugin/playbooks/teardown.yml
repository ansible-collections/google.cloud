---
- name: Teardown test suite
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars.yml
  environment:
    GCP_SERVICE_ACCOUNT_FILE: "{{ gcp_cred_file }}"
    GCP_AUTH_KIND: "{{ gcp_cred_kind }}"
    GCP_PROJECT: "{{ gcp_project }}"
  tasks:
    - name: TEARDOWN | Destroy instances
      google.cloud.gcp_compute_instance:
        name: "{{ prefix }}-{{ item.name }}"
        state: absent
        zone: "{{ gcp_zone }}"
        machine_type: "{{ gcp_machine_type }}"
      loop: "{{ sut }}"

    - name: TEARDOWN | Remove IAP firewall rule
      google.cloud.gcp_compute_firewall:
        name: "{{ prefix }}-iap"
        state: absent
        network:
          selfLink: "networks/{{ prefix }}"

    - name: TEARDOWN | Destroy network
      google.cloud.gcp_compute_network:
        name: "{{ prefix }}"
        state: absent
