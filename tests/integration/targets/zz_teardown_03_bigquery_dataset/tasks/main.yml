- name: Delete BigQuery Dataset
  google.cloud.gcp_bigquery_dataset:
    state: absent
    name: "{{ resource_name | regex_replace('-', '_') }}"
    dataset_reference:
      dataset_id: "{{ resource_name | regex_replace('-', '_') }}"
    project: "{{ gcp_project }}"
    auth_kind: "{{ gcp_cred_kind }}"
    service_account_file: "{{ gcp_cred_file }}"
