---
samples:
  - name: ansible_doc_featurestore_entitytype_feature
    exclude_test: true
    steps:
      - name: ansible_doc_featurestore_entitytype_feature
  - name: ansible_test_featurestore_entitytype_feature
    exclude_basic_doc: true
    steps:
      - name: ansible_setup_featurestore
        vars:
          suffix: fsetf
      - name: ansible_setup_featurestore_entitytype
        vars:
          suffix: fsetf
      - name: ansible_test_featurestore_entitytype_feature
      - name: ansible_teardown_featurestore_entitytype_feature
      - name: ansible_teardown_featurestore
        vars:
          suffix: fsetf
      - name: ansible_teardown_featurestore_entitytype
        vars:
          suffix: fsetf
properties:
  - name: name
    type: String
    description:
      The name of the feature. The feature can be up to 64 characters long and
      can consist only of ASCII Latin letters A-Z and a-z, underscore(_), and
      ASCII digits 0-9 starting with a letter. The value will be unique given an
      entity type.
    url_param_only: true
    immutable: true
    required: true
custom_code:
  custom_import: |
    import re
  pre_read: |
    # if this comes from a registered variable, strip down to base name
    resource.url_params["name"] = request.get("name").split("/")[-1]

    # extract region from entitytype
    pattern = r"projects/(.+)/locations/(.+)/featurestores/(.+)/entityTypes/(.+)"
    match = re.search(pattern, str(request.get("entitytype")))
    if match:
        resource.url_params["region"] = match.group(2)

  pre_create: _drop
  pre_delete: _drop
  encoder: _drop
