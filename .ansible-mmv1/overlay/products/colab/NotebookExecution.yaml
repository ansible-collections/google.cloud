---
samples:
  - name: ansible_doc_notebook_execution_basic
    exclude_test: true
    steps:
      - name: ansible_doc_notebook_execution_basic
  - name: ansible_doc_notebook_execution_custom_env
    exclude_test: true
    steps:
      - name: ansible_doc_notebook_execution_custom_env
  - name: ansible_doc_notebook_execution_dataform
    exclude_test: true
    steps:
      - name: ansible_doc_notebook_execution_dataform
  - name: ansible_test_notebook_execution
    exclude_basic_doc: true
    steps:
      - name: ansible_setup_network
        config_path: templates/ansible/samples/common/ansible_setup_network.tmpl
      - name: ansible_setup_bucket
        config_path: templates/ansible/samples/common/ansible_setup_bucket.tmpl
      - name: ansible_setup_credentials
      - name: ansible_setup_runtime_template
        vars:
          suffix: nb
      - name: ansible_test_notebook_execution
      - name: ansible_teardown_notebook_execution
      - name: ansible_teardown_runtime_template
        vars:
          suffix: nb
      - name: ansible_teardown_bucket
        config_path: templates/ansible/samples/common/ansible_teardown_bucket.tmpl
custom_code:
  pre_read: |
    # for this module, we're hitting the list endpoint and filtering on display name
    read_link = resource.build_link("list") + "?filter=displayName=" + request.get("display_name")

  post_read: |
    # if there are existing notebook executions, the call would have returned a list
    if not gcp_v2.empty(existing_obj):
        for nb in existing_obj.get("notebookExecutionJobs", []):
            if nb.get("displayName") == request.get("display_name"):
                existing_obj = nb
                break

  pre_create: |
    # if not provided, blank the notebook execution job id
    resource.url_params["notebook_execution_job_id"] = request.get("notebook_execution_job_id", "")

  custom_update:
    raise Exception("Updating a notebook execution is not supported")

  pre_delete: |
    # need to set required parameter "notebook_execution_job_id" from existing resource name
    resource.url_params["notebook_execution_job_id"] = existing_obj["name"].split("/")[-1]

  post_create: _drop
