---
custom_code:
  decoder: |
    # flatten name
    self.debug(response=response, decoded=False)
    if not gcp_v2.empty(response):
      if response.get("name"):
        n = response.pop("name")
        response["id"] = n
        response["name"] = gcp_v2.flatten_name(n)
    self.debug(response=response, decoded=True)

    return response

samples:
  - name: ansible_doc_create_hub
    exclude_test: true
    steps:
      - name: ansible_doc_create_hub
  - name: ansible_doc_delete_hub
    exclude_test: true
    steps:
      - name: ansible_doc_delete_hub
  - name: ansible_test_hub
    exclude_basic_doc: true
    steps:
      - name: ansible_setup_hub
      - name: ansible_test_hub
      - name: ansible_teardown_hub
