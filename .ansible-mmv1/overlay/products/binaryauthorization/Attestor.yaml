---
base_url: 'projects/{{project}}/attestors'
create_url: 'projects/{{project}}/attestors?attestorId={{name}}'
custom_code:
  decoder: |
    # flatten name
    self.debug(response=response, decoded=False)
    if not gcp_v2.empty(response):
        if response.get("name"):
            n: str = response.pop("name")
            response["id"] = n
            response["name"] = gcp_v2.flatten_name(n)
    self.debug(response=response, decoded=True)

    return response

samples:
  - name: ansible_doc_create
    exclude_test: true
    steps:
      - name: ansible_doc_create_attestor
  - name: ansible_doc_delete
    exclude_test: true
    steps:
      - name: ansible_doc_delete_attestor
  - name: ansible_test_attestor
    exclude_basic_doc: true
    steps:
      - name: ansible_setup_note
        config_path: templates/ansible/samples/services/containeranalysis/ansible_setup_note.tmpl
      - name: ansible_setup_attestor
      - name: ansible_test_attestor
      - name: ansible_teardown_attestor
      - name: ansible_teardown_note
        config_path: templates/ansible/samples/services/containeranalysis/ansible_teardown_note.tmpl
