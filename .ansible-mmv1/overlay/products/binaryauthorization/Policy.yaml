---
collection_url_key: "*"
custom_code:
  post_read: |
    if state == "absent":
      # nope, cheat and force the code go through the update path
      state = "present"

      # custom diff logic
      custom_diff = False  # init flag
      default_policy = {
          "globalPolicyEvaluationMode": "ENABLE",
          "defaultAdmissionRule": {
              "evaluationMode": "ALWAYS_ALLOW",
              "enforcementMode": "ENFORCED_BLOCK_AND_AUDIT_LOG",
          }
      }
      gcp_v2.debug(module, msg="Performing custom diff", existing=existing_obj, default=default_policy, custom_diff=custom_diff)
      if resource.diff(default_policy):
          custom_diff = True
      else:
          exceptions = ("name", "etag", "updateTime",)  # everything else should be empty
          for k in existing_obj.keys():
              if k in exceptions:
                  continue
              # anything not in exception which isn't empty means it's
              # different, remove_empties() should get rid of empty lists
              # before this, but just to be safe
              if k not in default_policy and len(existing_obj[k]) != 0:
                  custom_diff = True
                  break
      gcp_v2.debug(module, msg="Performed custom diff", custom_diff=custom_diff)

samples:
  - name: ansible_doc_create
    exclude_test: true
    steps:
      - name: ansible_doc_create_policy
  - name: ansible_doc_delete
    exclude_test: true
    steps:
      - name: ansible_doc_delete_policy
  - name: ansible_test_policy
    exclude_basic_doc: true
    steps:
      - name: ansible_setup_note
        config_path: templates/ansible/samples/services/containeranalysis/ansible_setup_note.tmpl
      - name: ansible_setup_attestor
        config_path: templates/ansible/samples/services/binaryauthorization/ansible_setup_attestor.tmpl
      - name: ansible_setup_policy
      - name: ansible_test_policy
      - name: ansible_teardown_policy
      - name: ansible_teardown_attestor
        config_path: templates/ansible/samples/services/binaryauthorization/ansible_teardown_attestor.tmpl
      - name: ansible_teardown_note
        config_path: templates/ansible/samples/services/containeranalysis/ansible_teardown_note.tmpl
