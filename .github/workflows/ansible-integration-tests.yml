---
name: Run integration tests for the cloud.google collection
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'tests/integration/targets/**'
env:
  GCP_SERVICE_ACCOUNT: github-ci@ansible-gcp-ci.iam.gserviceaccount.com
  GCP_PROJECT: ansible-gcp-ci
  GCP_PROJECT_NUMBER: "935806715932"
  GCP_FOLDER_ID: "542027184392"
  GCP_INTEGRATION_EMAIL: "ansibletestuser@gmail.com"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      # only need to change this one stanza to use the same
      # python version across all jobs in this workflow
      PYTHON: "3.13"
    outputs:
      python: ${{ steps.set-python.outputs.version }}
    steps:
      - id: set-python
        run: |
          echo "version=$PYTHON" >> $GITHUB_OUTPUT

  filter:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    outputs:
      targets: ${{ steps.match.outputs.targets }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - id: match
        name: Filter integration tests targets
        run: |
          set -ex
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "targets=cloud/gcp/" >> "$GITHUB_OUTPUT"  # run the full integration test on merge
          else
            echo "" > /tmp/integration_targets.txt
            # fetch modified modules
            git diff --name-only --diff-filter=ACMRT ..origin/master -- plugins/modules/ | grep -v '_info.py' | while read line
            do
              echo "$(basename $line .py)"
            done >> /tmp/integration_targets.txt
            # fetch modified integration tests
            git diff --name-only --diff-filter=ACMRT ..origin/master -- tests/integration/ | cut -d'/' -f4 >> /tmp/integration_targets.txt
            # fetch supplied targets in test-hints
            echo "$PR_BODY" | grep -i "^test-hints:" | grep -i "targets=" | tr ',' ' ' | cut -d'=' -f2 >> /tmp/integration_targets.txt
            echo "targets=$(grep . /tmp/integration_targets.txt | sort | uniq | paste -s -d' ') cloud/gcp/teardown/" >> "$GITHUB_OUTPUT"
          fi

  integration:
    # NOTE: GitHub does not allow secrets to be used
    # in PRs sent from forks. As such, this configuration is for
    # PRs that the maintainers would like to send to test.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/google/cloud
    needs:
      - setup
      - filter
    strategy:
      max-parallel: 1
      matrix:
        # Our current version strategy is to support all active versions of ansible-core
        # and test against the minimum version of Python supported by them. If/when we change
        # the integration tests to support parallelism we can revisit.
        ansible_version:
          - stable-2.19
          - stable-2.20
          - stable-2.21
    steps:
      - name: check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          path: ansible_collections/google/cloud
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ needs.setup.outputs.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install ansible-base (${{ matrix.ansible_version }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible_version }}.tar.gz --disable-pip-version-check
      # bootstrap integration env
      - name: Write integration-test configuration files
        env:
          CI_SERVICE_ACCOUNT_FILE_CONTENTS: ${{ secrets.CI_SERVICE_ACCOUNT_FILE_CONTENTS }}
        run: |
          echo "$CI_SERVICE_ACCOUNT_FILE_CONTENTS" > /tmp/service-account-key.json
          echo "[default]
          gcp_project: $GCP_PROJECT
          gcp_project_number: $GCP_PROJECT_NUMBER
          gcp_cred_file: /tmp/service-account-key.json
          gcp_cred_kind: serviceaccount
          gcp_cred_email: $GCP_SERVICE_ACCOUNT
          gcp_integration_email: $GCP_INTEGRATION_EMAIL
          gcp_folder_id: $GCP_FOLDER_ID
          " > ./tests/integration/cloud-config-gcp.ini
      # cleanup test environment
      - name: Auth to Gcloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        env:
          CI_SERVICE_ACCOUNT_FILE_CONTENTS: ${{ secrets.CI_SERVICE_ACCOUNT_FILE_CONTENTS }}
        with:
          service_account: $GCP_SERVICE_ACCOUNT
          credentials_json: ${{ secrets.CI_SERVICE_ACCOUNT_FILE_CONTENTS }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      #- name: Run cleanup
      #  run: |
      #    ./scripts/bootstrap-project.sh $GCP_PROJECT $GCP_SERVICE_ACCOUNT
      #    ./scripts/cleanup-project.sh $GCP_PROJECT $GCP_FOLDER_ID
      - name: Install required collections
        run: |
          ansible-galaxy install -r requirements-test.yml
      # run tests
      - name: Run integration tests
        # Add the -vvv flag to print out more output
        run: ansible-test integration -vvv --color --python ${{ needs.setup.outputs.python }} --venv-system-site-packages ${{ needs.filter.outputs.targets }}
