name: Run integration tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/**'
      - 'tests/integration/targets/**'
      - '.github/workflows/ansible-integration-tests.yml'

env:
  GCP_SERVICE_ACCOUNT: github-ci@ansible-gcp-ci.iam.gserviceaccount.com
  GCP_PROJECT: ansible-gcp-ci
  GCP_PROJECT_NUMBER: "935806715932"
  GCP_FOLDER_ID: "542027184392"
  GCP_INTEGRATION_EMAIL: "ansibletestuser@gmail.com"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - id: set-matrix
        run: |
          # yq reads the .yaml and outputs a clean, minified JSON string
          MATRIX_JSON=$(yq -o=json -I=0 .github/integration-test-matrix.yaml)
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  filter:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    outputs:
      targets: ${{ steps.match.outputs.targets }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - id: match
        name: Filter integration tests targets
        run: |
          set -ex
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "targets=cloud/gcp/" >> "$GITHUB_OUTPUT"  # run the full integration test on merge
          else
            echo "" > /tmp/integration_targets.txt
            # fetch modified modules
            git diff --name-only --diff-filter=ACMRT origin/master -- plugins/modules/ | grep -v '_info.py' | while read line
            do
              # fetch modules with accompanying integration test directory
              if [ -d "tests/integration/targets/$(basename $line .py)" ]; then
                echo "$(basename $line .py)"
              fi
            done >> /tmp/integration_targets.txt
            # fetch modified integration tests
            git diff --name-only --diff-filter=ACMRT origin/master -- tests/integration/ | cut -d'/' -f4 >> /tmp/integration_targets.txt
            # fetch supplied targets in test-hints
            echo "$PR_BODY" | grep -i "^test-hints:" | grep -i "targets=" | cut -d'=' -f2 | tr ',' ' ' | tr ' ' '\n' >> /tmp/integration_targets.txt
            echo "targets=$(grep . /tmp/integration_targets.txt | sort | uniq | paste -s -d' ') cloud/gcp/teardown/" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Ⓐ${{ matrix.ansible }} + Ⓟ${{ matrix.python }}
    # NOTE: GitHub does not allow secrets to be used
    # in PRs sent from forks. As such, this configuration is for
    # PRs that the maintainers would like to send to test.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ansible_collections/google/cloud
    needs:
      - setup
      - filter
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          path: ansible_collections/google/cloud
      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and ansible-core (${{ matrix.ansible }})
        run: |
          ${{ steps.python.outputs.python-path }} -m pip install -U pip
          ${{ steps.python.outputs.python-path }} -m pip install 'ansible-core==${{ matrix.ansible }}.*' -r requirements.txt
          ansible --version
      - name: Auth to Gcloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        env:
          CI_SERVICE_ACCOUNT_FILE_CONTENTS: ${{ secrets.CI_SERVICE_ACCOUNT_FILE_CONTENTS }}
        with:
          service_account: $GCP_SERVICE_ACCOUNT
          credentials_json: ${{ secrets.CI_SERVICE_ACCOUNT_FILE_CONTENTS }}
          cleanup_credentials: false
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      # bootstrap integration env
      - name: Write integration-test configuration files
        run: |
          echo "[default]
          gcp_project: $GCP_PROJECT
          gcp_project_number: $GCP_PROJECT_NUMBER
          gcp_cred_file: ${{ steps.auth.outputs.credentials_file_path }}
          gcp_cred_kind: serviceaccount
          gcp_cred_email: $GCP_SERVICE_ACCOUNT
          gcp_integration_email: $GCP_INTEGRATION_EMAIL
          gcp_folder_id: $GCP_FOLDER_ID
          " > ./tests/integration/cloud-config-gcp.ini
      - name: Install required collections as siblings
        run: |
          ansible-galaxy --version
          ansible-galaxy collection install -r requirements-test.yml -p ../../
          ansible-galaxy collection list
      # run tests on the host itself in a virtual environment, until we remove
      # all traces of gcloud command we cannot use the ansible-test GHA (which
      # runs in a container)
      - name: Run integration tests
        run: |
          ansible-test --version
          ansible-test integration -v --color --python-interpreter ${{ steps.python.outputs.python-path }} --local ${{ needs.filter.outputs.targets }}
