---
name: Collection health checks
on:
  pull_request:
    paths:
      - 'meta/**'
      - 'plugins/modules/**'
      - '.github/workflows/collection-health.yml'
jobs:
  check-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Check state of meta/runtime.yml
        run: python .github/check-meta.py
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Check state of README.md
        run: python .github/check-readme.py
        continue-on-error: true
