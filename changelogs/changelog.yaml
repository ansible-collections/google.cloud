    changes:
      bugfixes:
      - Disk has been fixed to send the sourceSnapshot parameter.
      - gcp_cloudtasks_queue - was not functional before, and is now functional.
      - gcp_compute_* - these resources use the correct selflink (www.googleapis.com)
