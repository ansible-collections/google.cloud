---
bugfixes:
  - audit - the indirect node counting query was shipped as ``extensions/audit/taxonomy.jq``. The Automation Platform controller only reads ``extensions/audit/event_query.yml``, so the file was never loaded and this collection reported no indirect nodes at all. It is now ``extensions/audit/event_query.yml`` (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - the query iterated the module result with ``.[]`` and called ``has("results")`` on each value, which raises ``Cannot check whether boolean has a string key`` on the ``changed`` key that every module returns. The controller catches jq errors and discards the whole event, so the query could not have emitted a record even if it had been loaded (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - the query selected resources with ``select($data.action | in($actions))``, but the controller passes jq only the module result and no module in this collection returns its own name, so nothing was ever selected. Each module now has its own entry keyed by FQCN (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - ``device_type`` was looked up by the resource ``kind``, which no module's ``response_to_hash()`` returns, so every resource would have been labelled ``missing``. Each module now carries its resource type literally (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - the identifier fell back to ``etag`` when a module returned no ``id``. ``etag`` changes on every mutation, so ``gcp_filestore_instance`` and ``gcp_bigquery_dataset`` counted the same resource again each time it was modified (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - ``name`` was part of ``canonical_facts``, which is the only key the controller deduplicates on, so a renamed resource counted twice (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - ``gcp_dns_resource_record_set`` was identified by name alone; an A record and a TXT record on the same name are two resources and were collapsed into one (https://github.com/ansible-collections/google.cloud/pull/779).
minor_changes:
  - audit - dropped the mappings for ``gcp_resource_record_set`` and ``gcp_sourcerepo_repository``; neither module exists in this collection (https://github.com/ansible-collections/google.cloud/pull/779).
  - audit - added ``tests/unit/audit/test_event_query_contract.py``, which asserts the constraints the controller imposes on the query file (https://github.com/ansible-collections/google.cloud/pull/779).
